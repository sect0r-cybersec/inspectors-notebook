[project]
name = "inspectors-notebook"
version = "0.1.0"
description = "Investigation recorder for SOC analysts: a docked desktop panel fed by a listener browser extension"
authors = [
    { name = "Sam", email = "harrison.2004@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pywebview>=6.2.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not desktop'"
markers = [
    "desktop: docks real windows against the Windows shell; rearranges the desktop while running",
]

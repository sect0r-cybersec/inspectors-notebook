[project]
name = "inspectors-notebook"
version = "0.1.0"
description = "Investigation recorder for SOC analysts: a docked desktop panel fed by a listener browser extension"
authors = [
    { name = "Sam", email = "harrison.2004@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0,<13",
    "pywebview>=6.2.1",
]

[project.scripts]
inspectors-notebook = "inspectors_notebook.app:main"
inspectors-notebook-relay = "inspectors_notebook.relay:main"
inspectors-notebook-register = "inspectors_notebook.register:main"
inspectors-notebook-eval = "inspectors_notebook.evaluation:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not desktop and not installer'"
markers = [
    "desktop: docks real windows against the Windows shell; rearranges the desktop while running",
    "installer: installs the built installer for this user; build it first with packaging/build.ps1",
]

<!doctype html>
<html lang="en-GB" data-theme="dark" data-side="right">
<head>
<meta charset="utf-8">
<title>Inspector's Notebook</title>
<style>/* panel.css */</style>
</head>
<body>

<section class="panel" aria-label="Inspector panel">
  <div class="resize" role="separator" aria-orientation="vertical" aria-label="Panel width" tabindex="0"
       aria-valuemin="320" aria-valuemax="640" aria-valuenow="400"></div>

  <header class="header">
    <div class="brand">
      <svg class="logo" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>
      <span>Inspector</span>
      <button class="icon small" data-action="theme" data-label="theme">
        <svg class="when-dark" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="when-light" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
      </button>
    </div>
    <div class="tools">
      <button class="icon" data-action="side" data-label="side">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"></path></svg>
      </button>
      <button class="icon" data-action="collapse" aria-label="Collapse to the screen edge" title="Collapse to the screen edge">
        <svg class="flip" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7l5 5-5 5M13 7l5 5-5 5"></path></svg>
      </button>
    </div>
  </header>

  <div class="status">
    <span class="idle-dot" aria-hidden="true"></span><span>Not recording</span><span aria-hidden="true">·</span><span class="listener" role="status">No browsers connected</span>
    <button class="outline small push-right" data-case="open_form">Start manually</button>
  </div>

  <div class="recording" hidden>
    <span class="rec-dot" aria-hidden="true"></span><span class="rec-label">Recording</span><span class="rec-timer mono" role="timer">00:00</span>
    <div class="push-right rec-actions">
      <button class="rec-btn" data-case="pause_or_resume">
        <svg class="when-recording" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg>
        <svg class="when-paused" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg>
        <span class="pause-label">Pause</span>
      </button>
      <button class="rec-btn" data-case="stop"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"></rect></svg>Stop</button>
    </div>
  </div>

  <section class="suggestion" aria-live="polite" hidden>
    <div class="suggestion-kicker"></div>
    <h2 class="suggestion-title"></h2>
    <div class="suggestion-meta mono"></div>
    <div class="suggestion-actions">
      <button class="primary grow" data-case="accept_suggestion"></button>
      <button class="outline" data-case="pause" hidden>Pause</button>
      <button class="outline" data-case="dismiss_suggestion"></button>
    </div>
  </section>

  <section class="case-header" hidden>
    <div class="case-meta"></div>
    <h1 class="case-title"></h1>
    <div class="chips case-entities"></div>
    <div class="counts"></div>
    <div class="seen" hidden>
      <span class="label">Seen in results</span>
      <div class="chips seen-entities"></div>
    </div>
  </section>

  <form class="start-form" hidden>
    <h1>Start a case</h1>
    <label>Incident ID <span class="faint">(optional)</span><input name="incidentId" class="mono" autocomplete="off"></label>
    <label>Title<input name="title" autocomplete="off"></label>
    <label>Entities <span class="faint">(one per line or comma separated)</span><textarea name="entities" rows="3" class="mono"></textarea></label>
    <div class="form-actions">
      <button type="submit" class="primary grow">Start case</button>
      <button type="button" class="outline" data-case="close_form">Cancel</button>
    </div>
  </form>

  <main class="empty">
    <h1>No case running</h1>
    <p>Open an incident in a connected console and Inspector will offer to start a case, or start one manually.</p>
  </main>
</section>

<nav class="rail" aria-label="Inspector, collapsed" hidden>
  <button class="icon rail-btn" data-action="collapse" aria-label="Expand panel" title="Expand panel">
    <svg class="flip" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 7l-5 5 5 5M11 7l-5 5 5 5"></path></svg>
  </button>
  <div class="rail-divider"></div>
  <div class="rail-rec" role="status" hidden><span class="rec-dot" aria-hidden="true"></span><span class="rec-timer mono">00:00</span></div>
  <div class="rail-spacer"></div>
  <button class="icon rail-btn" data-action="theme" data-label="theme">
    <svg class="when-dark" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    <svg class="when-light" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
  </button>
  <button class="icon rail-btn" data-action="side" data-label="side">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"></path></svg>
  </button>
  <svg class="logo rail-logo" width="20" height="20" viewBox="0 0 24 24" role="img" aria-label="Inspector"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>
</nav>

<script>/* panel.js */</script>
</body>
</html>

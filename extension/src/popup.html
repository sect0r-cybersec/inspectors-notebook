<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Inspector listener</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <svg class="logo" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>
  <span class="title">Inspector listener</span>
  <span class="app-status" role="status"><span class="dot" aria-hidden="true"></span><span class="app-text">App closed</span></span>
</header>

<main>
  <section class="closed" hidden>
    <p class="listening"></p>
    <button class="primary" data-action="open_app">Open Inspector</button>
    <label class="option"><input type="checkbox" data-action="set_open_on_console">Open Inspector when I open a console</label>
  </section>

  <section class="unavailable" hidden>
    <p>The Inspector relay isn't installed on this computer. Install the Inspector app, then restart the browser.</p>
  </section>

  <section class="connected" hidden>
    <div class="this-tab">
      <span class="label">This tab</span>
      <span class="tab-text"></span>
    </div>
    <label class="option pause" hidden><input type="checkbox" data-action="set_paused">Pause capture in this tab</label>
    <button class="secondary" data-action="open_app">Show Inspector</button>
  </section>

  <section class="site" hidden>
    <div class="this-tab">
      <span class="label">This site</span>
      <span class="site-text"></span>
    </div>
    <button class="secondary" data-site="add">Listen on this site</button>
    <button class="link" data-site="remove">Stop listening on this site</button>
  </section>
</main>
<script src="vendor/browser-polyfill.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
